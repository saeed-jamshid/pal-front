<title>PAL · درباره ما</title>
<style>
:root{
  --paper:#f8f3eb;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#f8f3eb; } }
:root[data-theme="dark"]{ --paper:#f8f3eb; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; height:100%; }
body{ background:var(--paper); display:grid; place-items:center; padding:4vmin; }
.card{ width:min(100%,980px); background:var(--paper); border-radius:18px; cursor:pointer; overflow:hidden;
  box-shadow:0 20px 60px -34px rgba(60,30,20,.28); }
svg{ display:block; width:100%; height:auto; visibility:hidden; }
svg.ready{ visibility:visible; }

/* intro */
.play .df{ stroke-dasharray:1 1; stroke-dashoffset:1;
  animation:draw var(--dur,1.1s) cubic-bezier(.6,0,.35,1) var(--d,0s) forwards; }
.play .fade{ opacity:0; animation:fadein .9s ease var(--d,0s) forwards; }
.play .grow{ transform:scale(0); animation:grow .9s cubic-bezier(.3,1.5,.5,1) var(--d,1s) forwards; }
.play .hop{ opacity:0; animation:hop .9s cubic-bezier(.3,1.6,.5,1) var(--d,2.4s) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes fadein{ to{ opacity:1; } }
@keyframes grow{ to{ transform:scale(1); } }
@keyframes hop{ 0%{ opacity:0; transform:translateY(10px); } 100%{ opacity:1; transform:none; } }
.grow{ transform-origin:0 0; }

/* loops */
.steam{ stroke-dasharray:.45 1.3; stroke-dashoffset:.45; opacity:0;
  animation:steam 3.6s linear infinite; animation-delay:calc(2.6s + var(--s,0s)); }
@keyframes steam{ 0%{ stroke-dashoffset:.45; opacity:0; } 18%{ opacity:1; } 75%{ opacity:.9; } 100%{ stroke-dashoffset:-1; opacity:0; } }
.sway{ animation:sway 3.8s ease-in-out infinite alternate; }
@keyframes sway{ from{ transform:translateX(-1.5px); } to{ transform:translateX(2px); } }
.wind{ stroke-dasharray:.6 1.6; stroke-dashoffset:.6;
  animation:wind var(--wd,7s) cubic-bezier(.45,0,.4,1) infinite; animation-delay:calc(2.2s + var(--w,0s)); }
@keyframes wind{ 0%{ stroke-dashoffset:.6; } 55%,100%{ stroke-dashoffset:-1; } }
.ripple{ animation:ripple var(--rd,4s) ease-in-out infinite alternate; animation-delay:var(--r,0s); }
@keyframes ripple{ from{ transform:translateX(-5px); opacity:.55; } to{ transform:translateX(5px); opacity:1; } }
.sun{ transform-box:fill-box; transform-origin:center; animation:sun 6s ease-in-out infinite alternate; }
@keyframes sun{ from{ transform:scale(.96) rotate(-3deg); } to{ transform:scale(1.05) rotate(3deg); } }
.swirl{ transform-origin:0 0; animation:spin 9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.bird{ animation:fly 17s linear infinite; animation-delay:var(--b,3s); opacity:0; }
@keyframes fly{ 0%{ transform:translate(-60px,0); opacity:1; } 50%{ transform:translate(390px,-14px); } 100%{ transform:translate(880px,-30px); opacity:1; } }
.wing{ transform-box:fill-box; transform-origin:center; animation:flap .55s ease-in-out infinite alternate; }
@keyframes flap{ from{ transform:scaleY(1); } to{ transform:scaleY(-.5); } }
.glow{ animation:flicker 3.2s steps(1,end) infinite; }
@keyframes flicker{ 0%{opacity:.95} 12%{opacity:.8} 14%{opacity:1} 38%{opacity:.88} 40%{opacity:.97} 71%{opacity:.84} 73%{opacity:1} 100%{opacity:.95} }
.lantern{ transform-box:fill-box; transform-origin:50% 0%; animation:swing 4.2s ease-in-out infinite alternate; }
@keyframes swing{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg); } }
.plant{ transform-box:fill-box; transform-origin:50% 100%; animation:lean 5.5s ease-in-out infinite alternate; }
.plant.b{ animation-duration:6.4s; animation-delay:-2s; }
@keyframes lean{ from{ transform:rotate(-1.2deg); } to{ transform:rotate(1.6deg); } }
.leaf{ transform-origin:0 0; animation:leaf var(--ld,3.4s) ease-in-out infinite alternate; animation-delay:var(--lo,0s); }
@keyframes leaf{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg); } }
.tail{ transform-box:fill-box; transform-origin:0% 100%; animation:tail 2.8s ease-in-out infinite alternate; }
@keyframes tail{ 0%{ transform:rotate(-10deg); } 60%{ transform:rotate(14deg); } 100%{ transform:rotate(4deg); } }
.ear{ transform-box:fill-box; transform-origin:50% 100%; animation:twitch 7s ease-in-out infinite; }
@keyframes twitch{ 0%,88%,100%{ transform:rotate(0); } 91%{ transform:rotate(-14deg); } 94%{ transform:rotate(6deg); } }
.eye{ transform-box:fill-box; transform-origin:center; animation:blink 5.2s ease-in-out infinite; }
@keyframes blink{ 0%,90%,100%{ transform:scaleY(1); } 94%{ transform:scaleY(-1); } }
.breath{ transform-box:fill-box; transform-origin:50% 100%; animation:breath 3.4s ease-in-out infinite; }
@keyframes breath{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.02,1.035); } }

.layer{ transition:transform .6s cubic-bezier(.2,.7,.2,1);
  transform:translate(calc(var(--mx,0) * var(--k) * 1px), calc(var(--my,0) * var(--k) * .5px)); }

@media (prefers-reduced-motion: reduce){
  .play .df{ animation:none; stroke-dashoffset:0; }
  .play .fade,.play .hop{ animation:none; opacity:1; }
  .play .grow{ animation:none; transform:none; }
  .steam{ animation:none; stroke-dasharray:none; opacity:1; }
  .wind{ animation:none; stroke-dasharray:none; stroke-dashoffset:0; }
  .ripple,.sun,.swirl,.sway,.wing,.glow,.lantern,.plant,.leaf,.tail,.ear,.eye,.breath{ animation:none; }
  .bird{ display:none; }
  .layer{ transition:none; }
}

.zz{ opacity:0; animation:zz 3s ease-in-out infinite; }
@keyframes zz{ 0%{ opacity:0; transform:translate(0,4px); } 30%{ opacity:1; } 100%{ opacity:0; transform:translate(6px,-10px); } }
@media (prefers-reduced-motion: reduce){ .zz{ animation:none; opacity:1; } }
</style>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C={ ink:'#1c1512', terra:'#a23a24', orange:'#ff8030', olive:'#6b6532', sage:'#bebd8e', stone:'#c7bcad' };
  function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
  let seedState=7;
  function rnd(){ seedState=(seedState*16807)%2147483647; return (seedState-1)/2147483646; }
  /* ---------- coffee plants ---------- */
  function leaf(parent,x,y,rot,len,w,cols,delay){
    const g0=el('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`},parent);
    const sway=el('g',{class:'leaf',style:`--ld:${(3+rnd()*1.6).toFixed(2)}s;--lo:${(-rnd()*3).toFixed(2)}s`},g0);
    const grow=el('g',{class:'grow',style:`--d:${delay.toFixed(2)}s`},sway);
    const g=el('g',{transform:`rotate(${rot.toFixed(1)})`},grow);
    const L=len,W=w;
    el('path',{d:`M0 0 C${L*.25} ${-W} ${L*.65} ${-W*.9} ${L} 0 C${L*.65} ${-W*.05} ${L*.3} ${W*.05} 0 0 Z`,fill:cols[0],transform:'translate(1.5 -1)'},g);
    el('path',{d:`M0 0 C${L*.3} ${W*.9} ${L*.7} ${W*.55} ${L} 0 C${L*.65} ${-W*.05} ${L*.3} ${W*.05} 0 0 Z`,fill:cols[1],transform:'translate(1 1.5)'},g);
    el('path',{class:'ink',d:`M0 0 C${L*.25} ${-W} ${L*.65} ${-W*.9} ${L} 0 C${L*.7} ${W*.55} ${L*.3} ${W*.9} 0 0`,stroke:C.ink,'stroke-width':1.8,'data-amp':'2.2'},g);
    el('path',{class:'ink','data-single':'',d:`M${L*.1} 0 C${L*.4} ${-W*.15} ${L*.7} ${W*.1} ${L*1.08} ${-W*.2} C${L*1.14} ${-W*.3} ${L*1.12} ${-W*.05} ${L*1.08} ${-W*.1}`,stroke:C.ink,'stroke-width':1.2},g);
  }
  function cherries(parent,x,y,delay,n){
    const off=[[0,0],[8,-3],[4,7],[-7,4],[-4,-7],[10,6]];
    const g=el('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`},parent);
    const grow=el('g',{class:'grow',style:`--d:${delay.toFixed(2)}s`},g);
    for(let i=0;i<n;i++){
      const [ox,oy]=off[i], r=5+rnd()*1.8, col=i%2?C.orange:C.terra;
      el('circle',{cx:ox+1.2,cy:oy+1,r:r,fill:col},grow);
      el('path',{class:'ink','data-amp':'.6',d:`M${ox-r} ${oy} C${ox-r} ${oy-r*1.1} ${ox+r} ${oy-r*1.1} ${ox+r} ${oy} C${ox+r} ${oy+r*1.1} ${ox-r} ${oy+r*1.1} ${ox-r} ${oy+1}`,stroke:C.ink,'stroke-width':1.5},grow);
    }
  }
  function plant(id,bx,by,h,leafLen,t0){
    const root=document.getElementById(id); if(!root) return;
    const P=[[bx,by],[bx-5,by-h*.3],[bx+7,by-h*.62],[bx,by-h]];
    const at=t=>{ const u=1-t; return [u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0], u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]]; };
    el('path',{class:'ink df',style:`--d:${t0}s;--dur:1.1s`,pathLength:1,stroke:C.ink,'stroke-width':2,
      d:`M${bx} ${by} C${P[1][0]} ${P[1][1]} ${P[2][0]} ${P[2][1]} ${P[3][0]} ${P[3][1]} C${bx-3} ${by-h-8} ${bx+5} ${by-h-12} ${bx+7} ${by-h-6} C${bx+8} ${by-h-2} ${bx+3} ${by-h-2} ${bx+4} ${by-h-5}`},root);
    const pal=[[C.olive,C.sage],[C.sage,C.stone],[C.olive,C.stone]];
    [.22,.42,.6,.77].forEach((t,i)=>{
      const [x,y]=at(t), k=1-t*.45, d=t0+.5+i*.14;
      leaf(root,x,y,-152+rnd()*14,leafLen*k,leafLen*.27*k,pal[i%3],d);
      leaf(root,x,y,-30+rnd()*14,leafLen*k*.95,leafLen*.27*k,pal[(i+1)%3],d+.07);
    });
    const [tx,ty]=at(.97);
    leaf(root,tx,ty,-98+rnd()*10,leafLen*.62,leafLen*.2,pal[0],t0+1.1);
    [[.36,-1],[.52,1],[.7,-1]].forEach(([t,s],i)=>{ const [x,y]=at(t); cherries(root,x+s*9,y+4,t0+1.2+i*.12,i===1?6:5); });
  }

  /* ---------- hand-drawn double line ---------- */
  function rough(p,amp,seed){
    const had=p.getAttribute('pathLength'); if(had) p.removeAttribute('pathLength');
    const L=p.getTotalLength(), n=Math.max(4,Math.ceil(L/3));
    seedState=seed; const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28], f=[.03+rnd()*.02,.09+rnd()*.05,.25+rnd()*.1];
    let d='';
    for(let i=0;i<=n;i++){
      const s=L*i/n, P=p.getPointAtLength(s), A=p.getPointAtLength(Math.max(0,s-.5)), B=p.getPointAtLength(Math.min(L,s+.5));
      const tx=B.x-A.x, ty=B.y-A.y, l=Math.hypot(tx,ty)||1;
      const o=amp*(.6*Math.sin(s*f[0]+ph[0])+.3*Math.sin(s*f[1]+ph[1])+.15*Math.sin(s*f[2]+ph[2]));
      d+=(i?'L':'M')+(P.x-ty/l*o).toFixed(1)+' '+(P.y+tx/l*o).toFixed(1);
    }
    if(had) p.setAttribute('pathLength',had);
    return d;
  }
  let sd=11;
  document.querySelectorAll('svg .ink').forEach(p=>{
    let L=0; try{ L=p.getTotalLength(); }catch(e){ return; }
    if(!L) return;
    const base=p.hasAttribute('data-amp')?parseFloat(p.getAttribute('data-amp')):Math.min(1.5,L/60+.3);
    if(p.hasAttribute('data-single')){ p.setAttribute('d',rough(p,base*.6,sd+=7)); return; }
    const second=p.cloneNode(true);
    const sw=parseFloat(p.getAttribute('stroke-width')||getComputedStyle(p).strokeWidth)||2;
    p.setAttribute('d',rough(p,base,sd+=7)); p.setAttribute('stroke-width',(sw*.85).toFixed(2));
    second.setAttribute('d',rough(second,base,sd+=13)); second.setAttribute('stroke-width',(sw*.55).toFixed(2)); second.setAttribute('opacity','.85');
    p.parentNode.insertBefore(second,p.nextSibling);
  });

  /* ---------- waving flags ---------- */
  const flags=[...document.querySelectorAll('.flag')].map(g=>({ a:g.children[0], b:g.children[1], x:+g.dataset.x, y:+g.dataset.y, len:+g.dataset.len }));
  function flagPath(f,t,dy){
    const s=f.len/46; let d='';
    for(let x=0;x<=f.len+.01;x+=2){ const y=Math.sin((x/s)*.16-t*4)*2.8*s*(x/f.len)-x*.05+dy; d+=(x?'L':'M')+(f.x+x).toFixed(1)+' '+(f.y+y).toFixed(1); }
    return d+` c${5*s} ${-3*s} ${9*s} ${2*s} ${5*s} ${6*s} c${-3*s} ${2*s} ${-6*s} ${-2*s} ${-3*s} ${-4*s}`;
  }
  const t0=performance.now();
  function tick(now){
    const t=reduce?0:(now-t0)/1000;
    flags.forEach(f=>{ if(f.a.getBoundingClientRect().width===0 && t>0) return; f.a.setAttribute('d',flagPath(f,t,0)); f.b.setAttribute('d',flagPath(f,t+.08,1.2*f.len/46)); });
    if(!reduce) requestAnimationFrame(tick);
  }
  flags.forEach(f=>{ f.a.setAttribute('d',flagPath(f,0,0)); f.b.setAttribute('d',flagPath(f,.08,1.2*f.len/46)); });
  requestAnimationFrame(tick);

  document.querySelectorAll('svg.scene').forEach(s=>s.classList.add('ready'));
  function replay(root){ root.querySelectorAll('svg.scene').forEach(s=>{ s.classList.remove('play'); void s.getBoundingClientRect(); s.classList.add('play'); }); }
  document.querySelectorAll('.scene-card').forEach(c=>c.addEventListener('click',()=>replay(c)));


  const art=document.getElementById('art'), card=document.getElementById('card');
  art.classList.add('play');
  card.addEventListener('click',()=>{ art.classList.remove('play'); void art.getBoundingClientRect(); art.classList.add('play'); });
  if(reduce) return;
  let raf=0;
  function setPointer(x,y){ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ art.style.setProperty('--mx',x.toFixed(3)); art.style.setProperty('--my',y.toFixed(3)); }); }
  window.addEventListener('pointermove',e=>{ const r=card.getBoundingClientRect(); setPointer(((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2); },{passive:true});
  window.addEventListener('pointerleave',()=>setPointer(0,0));
})();
</script>
