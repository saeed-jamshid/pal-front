<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAL · گربه و قهوه</title>
<style>
:root{ --paper:#efe3cf; color-scheme:light; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; width:100%; height:100%; background:var(--paper); }
body{ display:grid; place-items:center; }
.card{ display:block; width:100%; padding:0; border:0; background:transparent; cursor:pointer; overflow:hidden; }
.card:focus-visible{ outline:2px solid #2a6461; outline-offset:-3px; }
svg{ display:block; width:100%; height:auto; shape-rendering:geometricPrecision; }

/* one-shot entrance, same vocabulary as the landing scene */
.play .df{ stroke-dasharray:1 1; stroke-dashoffset:1; animation:draw var(--dur,1s) cubic-bezier(.6,0,.35,1) calc(var(--d,0s) * .5) forwards; }
.play .fade{ opacity:0; animation:fadein .8s ease calc(var(--d,0s) * .5) forwards; }
.play .grow{ transform:scale(0); animation:grow .8s cubic-bezier(.3,1.5,.5,1) calc(var(--d,1s) * .5) forwards; }
.play .hop{ opacity:0; animation:hop .8s cubic-bezier(.3,1.6,.5,1) calc(var(--d,1s) * .5) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes fadein{ to{ opacity:1; } }
@keyframes grow{ to{ transform:scale(1); } }
@keyframes hop{ 0%{ opacity:0; transform:translateY(12px); } 100%{ opacity:1; transform:none; } }
.grow{ transform-origin:0 0; }

/* ambient detail: transform/opacity/dash only; paused offscreen, on click and for reduced motion */
.steam{ stroke-dasharray:.45 1.3; stroke-dashoffset:.45; opacity:0; animation:steam 3.6s linear infinite; animation-delay:calc(.6s + var(--s,0s) * .3); }
@keyframes steam{ 0%{stroke-dashoffset:.45;opacity:0} 18%{opacity:1} 75%{opacity:.9} 100%{stroke-dashoffset:-1;opacity:0} }
.sway{ animation:sway 3.8s ease-in-out infinite alternate; }
@keyframes sway{ from{transform:translateX(-1.5px)} to{transform:translateX(2px)} }
.glow{ animation:flicker 3.2s steps(1,end) infinite; }
@keyframes flicker{ 0%,100%{opacity:.95} 12%{opacity:.8} 14%{opacity:1} 38%{opacity:.88} 40%{opacity:.97} 71%{opacity:.84} 73%{opacity:1} }
.lantern{ transform-box:fill-box; transform-origin:50% 0%; animation:swing 4.2s ease-in-out infinite alternate; }
@keyframes swing{ from{transform:rotate(-4deg)} to{transform:rotate(4deg)} }
.plant{ transform-box:fill-box; transform-origin:50% 100%; animation:lean 5.5s ease-in-out infinite alternate; }
.plant.b{ animation-duration:6.4s; animation-delay:-2s; }
@keyframes lean{ from{transform:rotate(-1.2deg)} to{transform:rotate(1.6deg)} }
.leaf{ transform-origin:0 0; animation:leaf var(--ld,3.4s) ease-in-out infinite alternate; animation-delay:var(--lo,0s); }
@keyframes leaf{ from{transform:rotate(-4deg)} to{transform:rotate(4deg)} }
.tail{ transform-box:fill-box; transform-origin:0% 100%; animation:tail 2.8s ease-in-out infinite alternate; }
@keyframes tail{ 0%{transform:rotate(-10deg)} 60%{transform:rotate(14deg)} 100%{transform:rotate(4deg)} }
.ear{ transform-box:fill-box; transform-origin:50% 100%; animation:twitch 7s ease-in-out infinite; }
@keyframes twitch{ 0%,88%,100%{transform:rotate(0)} 91%{transform:rotate(-14deg)} 94%{transform:rotate(6deg)} }
.eye{ transform-box:fill-box; transform-origin:center; animation:blink 5.2s ease-in-out infinite; }
@keyframes blink{ 0%,90%,100%{transform:scaleY(1)} 94%{transform:scaleY(.1)} }
.breath{ transform-box:fill-box; transform-origin:50% 100%; animation:breath 3.4s ease-in-out infinite; }
@keyframes breath{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.02,1.035)} }

.sun{ transform-box:fill-box; transform-origin:center; animation:sun 6s ease-in-out infinite alternate; }
@keyframes sun{ from{transform:scale(.96) rotate(-3deg)} to{transform:scale(1.05) rotate(3deg)} }
.rays{ animation:spin 40s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.cloud{ animation:drift var(--cd,16s) ease-in-out infinite alternate; }
@keyframes drift{ from{ translate:0 0; } to{ translate:var(--cx,24px) 0; } }
.wind{ stroke-dasharray:.6 1.6; stroke-dashoffset:.6; animation:wind var(--wd,7s) cubic-bezier(.45,0,.4,1) infinite; animation-delay:calc(.4s + var(--w,0s)); }
@keyframes wind{ 0%{stroke-dashoffset:.6} 55%,100%{stroke-dashoffset:-1} }

/* cat moods: tap reacts, pointer is watched, idle cat dozes off */
.m,.heart{ display:none; }
[data-mood=idle] .m-idle,[data-mood=surprised] .m-surprised,[data-mood=happy] .m-happy,[data-mood=wink] .m-wink,[data-mood=sleepy] .m-sleepy{ display:inline; }
.blink{ transform-box:fill-box; transform-origin:center; animation:blink 5.2s ease-in-out infinite; }
@keyframes blink{ 0%,90%,100%{transform:scaleY(1)} 94%{transform:scaleY(.1)} }
.head{ transform-box:fill-box; transform-origin:50% 90%; transition:transform .3s ease-out; }
.cat.jump{ transform-box:fill-box; transform-origin:50% 100%; animation:jump .6s cubic-bezier(.3,1.5,.5,1); }
@keyframes jump{ 0%{transform:scale(1.06,.92)} 35%{transform:translateY(-16px) scale(.97,1.05)} 70%{transform:translateY(0) scale(1.04,.96)} 100%{transform:none} }
[data-mood=surprised] .tail{ animation:none; transform:rotate(-18deg) scale(1.08); }
.zz{ animation:zz 2.6s ease-in-out infinite; }
@keyframes zz{ 0%{opacity:0; translate:0 6px} 30%,70%{opacity:1} 100%{opacity:0; translate:6px -10px} }
.registered .heart{ display:inline; transform-box:fill-box; transform-origin:50% 100%; animation:hop .7s cubic-bezier(.3,1.6,.5,1) .5s both; }

body.paused *,body.offscreen *,body.static *{ animation-play-state:paused !important; }
@media (prefers-reduced-motion: reduce){
  .play .df{ animation:none; stroke-dashoffset:0; }
  .play .fade,.play .hop{ animation:none; opacity:1; }
  .play .grow{ animation:none; transform:none; }
  .steam{ animation:none; stroke-dasharray:none; stroke-dashoffset:0; opacity:.8; }
  .registered .heart,.cat.jump{ animation:none; }
  .zz{ animation:none; opacity:1; }
  .head{ transition:none; }
}
</style>
</head>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const art=document.getElementById('art'), card=document.getElementById('card');
  const C={ ink:'#1c1512', terra:'#a23a24', orange:'#ff8030', olive:'#6b6532', sage:'#bebd8e', stone:'#c7bcad' };
  function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
  let seed=11;
  function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }

  /* coffee plants: same leaf/cherry construction as the landing scene */
  function leaf(parent,x,y,rot,L,W,cols,delay){
    const g0=el('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`},parent);
    const sway=el('g',{class:'leaf',style:`--ld:${(3+rnd()*1.6).toFixed(2)}s;--lo:${(-rnd()*3).toFixed(2)}s`},g0);
    const grow=el('g',{class:'grow',style:`--d:${delay.toFixed(2)}s`},sway);
    const g=el('g',{transform:`rotate(${rot.toFixed(1)})`},grow);
    el('path',{d:`M0 0 C${L*.25} ${-W} ${L*.65} ${-W*.9} ${L} 0 C${L*.65} ${-W*.05} ${L*.3} ${W*.05} 0 0 Z`,fill:cols[0],transform:'translate(1.5 -1)'},g);
    el('path',{d:`M0 0 C${L*.3} ${W*.9} ${L*.7} ${W*.55} ${L} 0 C${L*.65} ${-W*.05} ${L*.3} ${W*.05} 0 0 Z`,fill:cols[1],transform:'translate(1 1.5)'},g);
    el('path',{d:`M0 0 C${L*.25} ${-W} ${L*.65} ${-W*.9} ${L} 0 C${L*.7} ${W*.55} ${L*.3} ${W*.9} 0 0`,stroke:C.ink,'stroke-width':1.8},g);
    el('path',{d:`M${L*.1} 0 C${L*.4} ${-W*.15} ${L*.7} ${W*.1} ${L*1.08} ${-W*.2}`,stroke:C.ink,'stroke-width':1.2},g);
  }
  function cherries(parent,x,y,delay,n){
    const off=[[0,0],[8,-3],[4,7],[-7,4],[-4,-7],[10,6]];
    const grow=el('g',{class:'grow',style:`--d:${delay.toFixed(2)}s`},el('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`},parent));
    for(let i=0;i<n;i++){
      const [ox,oy]=off[i], r=5+rnd()*1.8;
      el('circle',{cx:ox+1.2,cy:oy+1,r:r,fill:i%2?C.orange:C.terra},grow);
      el('circle',{cx:ox,cy:oy,r:r,stroke:C.ink,'stroke-width':1.5},grow);
    }
  }
  function plant(id,bx,by,h,leafLen,t0){
    const root=document.getElementById(id);
    const P=[[bx,by],[bx-5,by-h*.3],[bx+7,by-h*.62],[bx,by-h]];
    const at=t=>{ const u=1-t; return [u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0], u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]]; };
    el('path',{class:'df',style:`--d:${t0}s;--dur:1.1s`,pathLength:1,stroke:C.ink,'stroke-width':2,
      d:`M${bx} ${by} C${P[1][0]} ${P[1][1]} ${P[2][0]} ${P[2][1]} ${P[3][0]} ${P[3][1]} C${bx-3} ${by-h-8} ${bx+5} ${by-h-12} ${bx+7} ${by-h-6}`},root);
    const pal=[[C.olive,C.sage],[C.sage,C.stone],[C.olive,C.stone]];
    [.22,.42,.6,.77].forEach((t,i)=>{
      const [x,y]=at(t), k=1-t*.45, d=t0+.5+i*.14;
      leaf(root,x,y,-152+rnd()*14,leafLen*k,leafLen*.27*k,pal[i%3],d);
      leaf(root,x,y,-30+rnd()*14,leafLen*k*.95,leafLen*.27*k,pal[(i+1)%3],d+.07);
    });
    const [tx,ty]=at(.97);
    leaf(root,tx,ty,-98+rnd()*10,leafLen*.62,leafLen*.2,pal[0],t0+1.1);
    [[.36,-1],[.52,1],[.7,-1]].forEach(([t,s],i)=>{ const [x,y]=at(t); cherries(root,x+s*9,y+4,t0+1.2+i*.12,i===1?6:5); });
  }
  plant('plantL',172,432,200,70,.3);
  plant('plantR',640,432,130,50,.5);

  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  const cat=document.getElementById('cat'), head=document.getElementById('head');
  let visible=true, timer=0, sleepTimer=0, taps=0;
  const done=()=>/success|done|registered/.test(location.hash);
  const rest=()=>done()?'happy':'idle';
  function mood(m){ art.dataset.mood=m; }
  function doze(){ clearTimeout(sleepTimer); sleepTimer=setTimeout(()=>{ if(art.dataset.mood===rest()&&!done()) mood('sleepy'); },12000); }
  function settle(){ mood(rest()); art.classList.toggle('registered',done()); doze(); }
  function react(){
    clearTimeout(timer); taps++;
    cat.classList.remove('jump'); void cat.getBoundingClientRect(); if(!motion.matches) cat.classList.add('jump');
    mood('surprised');
    timer=setTimeout(()=>{ mood(taps%2?'happy':'wink'); timer=setTimeout(settle,2200); },650);
  }
  function look(e){
    if(art.dataset.mood==='sleepy') settle(); else doze();
    if(motion.matches) return;
    const r=art.getBoundingClientRect(), k=r.width/800;
    const dx=e.clientX-(r.left+330*k);
    head.style.transform=`rotate(${Math.max(-6,Math.min(6,dx/(40*k))).toFixed(1)}deg)`;
  }
  function leave(){ head.style.transform=''; }
  function sync(){ const b=document.body.classList; b.toggle('static',motion.matches); b.toggle('offscreen',!visible||document.hidden); }
  art.classList.add('play'); settle();
  cat.addEventListener('animationend',e=>{ if(e.animationName==='jump') cat.classList.remove('jump'); });
  window.addEventListener('hashchange',settle);
  card.addEventListener('click',react);
  card.addEventListener('pointermove',look); card.addEventListener('pointerleave',leave);
  motion.addEventListener('change',sync); document.addEventListener('visibilitychange',sync);
  new IntersectionObserver(([e])=>{ visible=e.isIntersecting; sync(); }).observe(card); sync();
})();
</script>
</body>
